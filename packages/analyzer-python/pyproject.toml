[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-motion-bridge"
version = "0.1.0"
description = "Local video-to-code pose analysis and HyperFrames trace generation"
requires-python = ">=3.10"
dependencies = [
  "mediapipe>=0.10.0",
  "opencv-python>=4.8.0"
]

[project.optional-dependencies]
# Install a PyTorch build that matches the intended CPU/CUDA runtime first.
# MMPose's optional MMDetection stack is deliberately not a base dependency.
mmpose = [
  "mmpose>=1.3,<2",
  "mmdet>=3.0,<4",
  "mmcv>=2.0,<3",
  "mmengine>=0.10,<1"
]

[project.scripts]
omb = "open_motion_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
